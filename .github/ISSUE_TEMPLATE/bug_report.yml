name: Bug report
description: Report a reproducible problem with Upload UI Evidence.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include ingest tokens, upload tokens, Blob URLs, or private test evidence.
        Report security vulnerabilities privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Action version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: Runner
      placeholder: ubuntu-latest
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow excerpt
      description: Remove all secrets before pasting YAML.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, signed URLs, and private evidence.
      render: text
